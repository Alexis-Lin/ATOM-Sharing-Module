function drawMap(){
  var h=&#x27;&#x27;;
  LANES.forEach(function(l){
    h+=&#x27;&lt;div class=&quot;lane&quot;&gt;&lt;div class=&quot;ln&quot;&gt;&#x27;+l.name+&#x27;&lt;small&gt;&#x27;+l.sub+&#x27;&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;nodes&quot;&gt;&#x27;;
    l.seq.forEach(function(id,i){
      if(i)h+=&#x27;&lt;span class=&quot;aw&quot;&gt;→&lt;/span&gt;&#x27;;
      h+=node(id);
      if(l.branch&amp;&amp;l.branch[id]){h+=&#x27;&lt;span class=&quot;aw&quot;&gt;⤷&lt;/span&gt;&#x27;;l.branch[id].forEach(function(b,j){if(j)h+=&#x27;&lt;span class=&quot;aw&quot;&gt;→&lt;/span&gt;&#x27;;h+=node(b,true);});h+=&#x27;&lt;span class=&quot;aw&quot;&gt;⤶&lt;/span&gt;&#x27;;}

    });
    h+=&#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;
  });
  document.getElementById(&#x27;map&#x27;).innerHTML=h;
}
