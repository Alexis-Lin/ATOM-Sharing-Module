          &lt;div class=&quot;chan&quot; onclick=&quot;share(&#x27;更多&#x27;)&quot;&gt;&lt;i&gt;&lt;/i&gt;更多&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;toast&quot; id=&quot;toast&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- ================= CONTROLS ================= --&gt;
    &lt;div&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;h3&gt;模拟好友的动作&lt;/h3&gt;
        &lt;div class=&quot;d&quot;&gt;这些事件真实发生在服务端；这里按一下，看邀请人这一端会看到什么。&lt;/div&gt;
        &lt;div class=&quot;cbtns&quot;&gt;
          &lt;button class=&quot;cb&quot; onclick=&quot;evClick()&quot;&gt;好友点击了链接&lt;/button&gt;
          &lt;button class=&quot;cb pri&quot; onclick=&quot;evBuy()&quot;&gt;好友下单了&lt;/button&gt;
          &lt;button class=&quot;cb&quot; onclick=&quot;evActivate()&quot;&gt;好友激活了设备&lt;/button&gt;
          &lt;button class=&quot;cb warn&quot; onclick=&quot;evRefund()&quot;&gt;好友退货了&lt;/button&gt;
          &lt;button class=&quot;cb&quot; onclick=&quot;reset()&quot;&gt;重置&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;log&quot; id=&quot;log&quot;&gt;&lt;span style=&quot;color:var(--faint)&quot;&gt;事件日志会出现在这里&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;panel map&quot; style=&quot;margin-top:14px&quot;&gt;
        &lt;h3&gt;页面结构&lt;/h3&gt;
        &lt;div class=&quot;d&quot;&gt;一个主页面 + 三个二级页；分享面板是覆盖层不是页面。&lt;/div&gt;
        &lt;div class=&quot;mrow&quot;&gt;&lt;div class=&quot;nd&quot;&gt;&quot;我的&quot; 页 banner&lt;small&gt;入口 ①&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;aw&quot;&gt;/&lt;/span&gt;&lt;div class=&quot;nd&quot;&gt;课后报告底部&lt;small&gt;入口 ②&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;aw&quot;&gt;/&lt;/span&gt;&lt;div class=&quot;nd&quot;&gt;推送通知&lt;small&gt;入口 ③&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;mrow&quot;&gt;&lt;span class=&quot;aw&quot;&gt;↓&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;mrow&quot;&gt;&lt;div class=&quot;nd hi&quot;&gt;邀请页&lt;small&gt;hero · 一键分享 · 数据 · 怎么做 · 动态&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;mrow&quot;&gt;&lt;span class=&quot;aw&quot;&gt;↓&lt;/span&gt;&lt;div class=&quot;nd&quot;&gt;分享面板&lt;small&gt;覆盖层：图片 / 链接 × 渠道&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;nd&quot;&gt;邀请明细&lt;small&gt;按人 · 按来源&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;nd&quot;&gt;我的权益&lt;small&gt;已得 · 下一档&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;nd&quot;&gt;规则&lt;small&gt;五问五答&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;02 · 简化后的口径&lt;/div&gt;
  &lt;h2&gt;业务只看一个数，用户看三个数&lt;/h2&gt;
  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;vc&quot;&gt;
      &lt;h4&gt;业务侧：通过分享带来的订单数&lt;/h4&gt;
      &lt;p&gt;不追求逐单归因到人也能算清楚。凡是&lt;b&gt;订单带 token&lt;/b&gt;（自有商城）或&lt;b&gt;激活时填了码&lt;/b&gt;的，都算&quot;分享带来的订单&quot;。两条来源相加就是这个数，不需要联盟链接、不需要安装归因 SDK。&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;vc&quot;&gt;
      &lt;h4&gt;用户侧：点击 · 购买 · 权益&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;b&gt;点击&lt;/b&gt;：落地页按 token 计数，几乎零成本，但它是用户最先看到变化的数字——&lt;b&gt;动机的第一反馈&lt;/b&gt;。&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;购买&lt;/b&gt;：同上面业务口径，按 token 拆到人。&lt;/li&gt;
        &lt;li&gt;&lt;b&gt;权益&lt;/b&gt;：会员天数 + 下一档进度。&lt;b&gt;&quot;再邀 1 位解锁 ×&quot;&lt;/b&gt; 这一行是页面上最有推力的一句话。&lt;/li&gt;
      &lt;/ul&gt;
    &lt;/div&gt;
    &lt;div class=&quot;vc&quot;&gt;
      &lt;h4&gt;三个状态，别混&lt;/h4&gt;
      &lt;ul&gt;
        &lt;li&gt;&lt;code&gt;下单&lt;/code&gt; → 数字动、权益标&quot;待到账&quot;&lt;/li&gt;
        &lt;li&gt;&lt;code&gt;激活&lt;/code&gt; → 权益到账、推送通知&lt;/li&gt;
        &lt;li&gt;&lt;code&gt;退货&lt;/code&gt; → 权益收回、动态里留痕&lt;/li&gt;
      &lt;/ul&gt;
      &lt;p style=&quot;margin-top:6px&quot;&gt;用户看到&quot;待到账&quot;会去催朋友激活——把补录压力交给有动机的一方。&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;03 · 页面要素清单&lt;/div&gt;
  &lt;h2&gt;给设计的任务书&lt;/h2&gt;
  &lt;div class=&quot;scroll&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;width:120px&quot;&gt;区块&lt;/th&gt;&lt;th style=&quot;width:250px&quot;&gt;内容&lt;/th&gt;&lt;th&gt;交互&lt;/th&gt;&lt;th style=&quot;width:70px&quot;&gt;优先级&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Hero&lt;/b&gt;&lt;/td&gt;&lt;td&gt;利益点两句话（好友得什么 / 我得什么）+ 我的邀请码&lt;/td&gt;&lt;td&gt;点码复制。码永远可见，是链路断了时的最后一根绳&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;一键分享&lt;/b&gt;&lt;/td&gt;&lt;td&gt;主按钮 + 两个次按钮（保存图 / 复制链接）&lt;/td&gt;&lt;td&gt;拉起分享面板：图片 / 链接 二选一 × 渠道；默认选图片（国内）或链接（海外），由 Profile 决定&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;数据&lt;/b&gt;&lt;/td&gt;&lt;td&gt;点击 / 购买 / 权益 三格&lt;/td&gt;&lt;td&gt;点击进明细页；数字变化时有一次高亮&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;下一档进度&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&quot;再邀 N 位解锁 ×&quot; + 进度条 + 三档阶梯&lt;/td&gt;&lt;td&gt;随购买数实时更新&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;怎么做&lt;/b&gt;&lt;/td&gt;&lt;td&gt;三步：发给朋友 → 朋友下单 → 你得权益&lt;/td&gt;&lt;td&gt;静态，可折叠&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;最近动态&lt;/b&gt;&lt;/td&gt;&lt;td&gt;脱敏昵称 + 事件 + 来源 + 权益状态&lt;/td&gt;&lt;td&gt;新事件置顶高亮&lt;/td&gt;&lt;td&gt;P1&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;邀请明细&lt;/b&gt;&lt;/td&gt;&lt;td&gt;按人（漏斗态）/ 按来源（图 vs 链接 vs 训练图二维码）&lt;/td&gt;&lt;td&gt;只读&lt;/td&gt;&lt;td&gt;P1&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;我的权益&lt;/b&gt;&lt;/td&gt;&lt;td&gt;总天数 + 已得列表 + 下一档&lt;/td&gt;&lt;td&gt;只读&lt;/td&gt;&lt;td&gt;P1&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;规则&lt;/b&gt;&lt;/td&gt;&lt;td&gt;五问五答&lt;/td&gt;&lt;td&gt;只读&lt;/td&gt;&lt;td&gt;P0（法务要看）&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;推送&lt;/b&gt;&lt;/td&gt;&lt;td&gt;好友下单 / 激活 / 权益到账&lt;/td&gt;&lt;td&gt;点击直达邀请页&lt;/td&gt;&lt;td&gt;P1&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;P0 只做邀请页 + 分享面板 + 规则页&lt;/b&gt;；明细、权益页、推送、动态流都是 P1。P0 版本里三格数据不可点，进度条保留——它是动机的核心，不能砍。&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
(function(){
  // fake QR
  var g=document.getElementById(&#x27;qrg&#x27;),s=9137,out=&#x27;&#x27;,N=21;
  function rnd(){s=(s*1103515245+12345)&amp;0x7fffffff;return s/0x7fffffff;}
  var m=[];for(var y=0;y&lt;N;y++){m.push([]);for(var x=0;x&lt;N;x++)m[y].push(rnd()&gt;0.5?1:0);}
  function fd(ox,oy){for(var y=0;y&lt;7;y++)for(var x=0;x&lt;7;x++){m[oy+y][ox+x]=((x===0||x===6||y===0||y===6)||(x&gt;=2&amp;&amp;x&lt;=4&amp;&amp;y&gt;=2&amp;&amp;y&lt;=4))?1:0;}
    for(var y=-1;y&lt;8;y++)for(var x=-1;x&lt;8;x++){var yy=oy+y,xx=ox+x;if(yy&lt;0||xx&lt;0||yy&gt;=N||xx&gt;=N)continue;if(y===-1||y===7||x===-1||x===7)m[yy][xx]=0;}}
  fd(0,0);fd(14,0);fd(0,14);
  for(var y=0;y&lt;N;y++)for(var x=0;x&lt;N;x++)if(m[y][x])out+=&#x27;&lt;rect x=&quot;&#x27;+x+&#x27;&quot; y=&quot;&#x27;+y+&#x27;&quot; width=&quot;1&quot; height=&quot;1&quot;/&gt;&#x27;;
  g.innerHTML=out;
})();

var S={click:12,buy:2,act:1,days:60,pending:1,form:&#x27;img&#x27;,n:0};
var names=[&#x27;Zhao**&#x27;,&#x27;Qian**&#x27;,&#x27;Sun**&#x27;,&#x27;Li**&#x27;,&#x27;Zhou**&#x27;,&#x27;Wu**&#x27;];
var pendingQueue=[&#x27;Wang**&#x27;]; // ordered, not yet activated
var activated=[&#x27;Lin**&#x27;,&#x27;Chen**&#x27;];

function $(id){return document.getElementById(id);}
function go(id){document.querySelectorAll(&#x27;.scr&#x27;).forEach(function(e){e.classList.remove(&#x27;on&#x27;);});$(&#x27;s-&#x27;+id).classList.add(&#x27;on&#x27;);$(&#x27;s-&#x27;+id).scrollTop=0;}
function toast(t){var e=$(&#x27;toast&#x27;);e.textContent=t;e.classList.add(&#x27;on&#x27;);clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove(&#x27;on&#x27;);},1600);}
function openSheet(f){if(f)pick(f);$(&#x27;veil&#x27;).classList.add(&#x27;on&#x27;);$(&#x27;sheet&#x27;).classList.add(&#x27;on&#x27;);}
function closeSheet(){$(&#x27;veil&#x27;).classList.remove(&#x27;on&#x27;);$(&#x27;sheet&#x27;).classList.remove(&#x27;on&#x27;);}
function pick(f){S.form=f;$(&#x27;f-img&#x27;).classList.toggle(&#x27;on&#x27;,f===&#x27;img&#x27;);$(&#x27;f-link&#x27;).classList.toggle(&#x27;on&#x27;,f===&#x27;link&#x27;);}
function share(ch){closeSheet();toast((S.form===&#x27;img&#x27;?&#x27;邀请图&#x27;:&#x27;链接&#x27;)+&#x27; 已分享到 &#x27;+ch);log(&#x27;邀请人分享了 &lt;b&gt;&#x27;+(S.form===&#x27;img&#x27;?&#x27;邀请图&#x27;:&#x27;链接&#x27;)+&#x27;&lt;/b&gt; → &#x27;+ch+&#x27;（token 7K2A 已带上）&#x27;);}
function hidePush(){$(&#x27;push&#x27;).classList.remove(&#x27;on&#x27;);}
function push(t,d){$(&#x27;pushT&#x27;).textContent=t;$(&#x27;pushD&#x27;).textContent=d;$(&#x27;push&#x27;).classList.add(&#x27;on&#x27;);clearTimeout(window._p);window._p=setTimeout(hidePush,3200);}
function bump(id){var e=$(id);e.classList.add(&#x27;bump&#x27;);setTimeout(function(){e.classList.remove(&#x27;bump&#x27;);},900);}
function log(h){var l=$(&#x27;log&#x27;);if(!l.dataset.x){l.innerHTML=&#x27;&#x27;;l.dataset.x=1;}var d=new Date();l.innerHTML=&#x27;&lt;div&gt;&#x27;+d.toTimeString().slice(0,8)+&#x27;  &#x27;+h+&#x27;&lt;/div&gt;&#x27;+l.innerHTML;}
function feed(html,cls){var f=$(&#x27;feed&#x27;);f.querySelectorAll(&#x27;.f.new&#x27;).forEach(function(e){e.classList.remove(&#x27;new&#x27;);});var d=document.createElement(&#x27;div&#x27;);d.className=&#x27;f new&#x27;;d.innerHTML=html;f.insertBefore(d,f.firstChild);}

function render(){
  $(&#x27;nClick&#x27;).textContent=S.click;$(&#x27;nBuy&#x27;).textContent=S.buy;$(&#x27;nRw&#x27;).textContent=S.days;
  $(&#x27;dClick&#x27;).textContent=S.click;$(&#x27;dBuy&#x27;).textContent=S.buy;$(&#x27;dAct&#x27;).textContent=S.act;
  $(&#x27;rwBig&#x27;).innerHTML=S.days+&#x27;&lt;small&gt;天&lt;/small&gt;&#x27;;
  var tier=S.buy&gt;=5?5:(S.buy&gt;=3?3:1), next=S.buy&gt;=5?null:(S.buy&gt;=3?5:3), cap=next||5;
  var pct=Math.min(100,S.buy/cap*100);
  $(&#x27;progBar&#x27;).style.width=pct+&#x27;%&#x27;;$(&#x27;progBar2&#x27;).style.width=Math.min(100,S.buy/3*100)+&#x27;%&#x27;;
  $(&#x27;progN&#x27;).textContent=Math.min(S.buy,cap)+&#x27; / &#x27;+cap;$(&#x27;progN2&#x27;).textContent=Math.min(S.buy,3)+&#x27; / 3&#x27;;
  $(&#x27;progT&#x27;).textContent= next? (&#x27;再邀 &#x27;+(next-S.buy)+&#x27; 位，解锁&#x27;+(next===3?&#x27;配件券&#x27;:&#x27;限定套装&#x27;)) : &#x27;已解锁全部档位&#x27;;
}
function evClick(){S.click++;render();bump(&#x27;nClick&#x27;);log(&#x27;落地页命中 token 7K2A → &lt;b&gt;点击 +1&lt;/b&gt;（用户端立即可见）&#x27;);}
function evBuy(){var n=names[S.n++%names.length];S.buy++;S.pending++;pendingQueue.push(n);render();bump(&#x27;nBuy&#x27;);
  feed(&#x27;&lt;div class=&quot;a&quot;&gt;&#x27;+n[0]+&#x27;&lt;/div&gt;&lt;div class=&quot;tx&quot;&gt;&#x27;+n+&#x27; 已下单，等待激活&lt;small&gt;刚刚 · 通过&#x27;+(S.form===&#x27;img&#x27;?&#x27;邀请图&#x27;:&#x27;链接&#x27;)+&#x27;&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;rw dim&quot;&gt;待到账&lt;/div&gt;&#x27;);
  push(n+&#x27; 通过你的邀请下单了&#x27;,&#x27;激活设备后 30 天会员到账&#x27;);
  log(&#x27;订单带 token（或激活填码）→ &lt;b&gt;购买 +1&lt;/b&gt;，权益记为 &lt;b&gt;待到账&lt;/b&gt;；业务侧&quot;分享带来的订单&quot;+1&#x27;);}
function evActivate(){if(!pendingQueue.length){toast(&#x27;没有待激活的订单&#x27;);log(&#x27;无待激活订单，先点&quot;好友下单了&quot;&#x27;);return;}
  var n=pendingQueue.shift();S.act++;S.pending--;S.days+=30;activated.push(n);render();bump(&#x27;nRw&#x27;);
  feed(&#x27;&lt;div class=&quot;a&quot;&gt;&#x27;+n[0]+&#x27;&lt;/div&gt;&lt;div class=&quot;tx&quot;&gt;&#x27;+n+&#x27; 激活了 Atom&lt;small&gt;刚刚&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;rw&quot;&gt;+30 天&lt;/div&gt;&#x27;);
  push(&#x27;+30 天会员已到账&#x27;,n+&#x27; 已激活 Atom · 查看权益&#x27;);
  var r=$(&#x27;rwList&#x27;);var d=document.createElement(&#x27;div&#x27;);d.className=&#x27;f&#x27;;d.innerHTML=&#x27;&lt;div class=&quot;tx&quot;&gt;30 天会员&lt;small&gt;刚刚 · &#x27;+n+&#x27; 激活&lt;/small&gt;&lt;/div&gt;&lt;span class=&quot;pill&quot;&gt;已到账&lt;/span&gt;&#x27;;r.insertBefore(d,r.firstChild);
  log(&#x27;激活事件 → 权益 &lt;b&gt;已到账 +30 天&lt;/b&gt;，推送通知&#x27;);}
function evRefund(){if(!activated.length){toast(&#x27;没有可退的订单&#x27;);return;}
  var n=activated.pop();S.buy=Math.max(0,S.buy-1);S.act=Math.max(0,S.act-1);S.days=Math.max(0,S.days-30);render();
  feed(&#x27;&lt;div class=&quot;a&quot;&gt;&#x27;+n[0]+&#x27;&lt;/div&gt;&lt;div class=&quot;tx&quot;&gt;&#x27;+n+&#x27; 退货，权益已收回&lt;small&gt;刚刚&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;rw&quot; style=&quot;color:#C2410C&quot;&gt;−30 天&lt;/div&gt;&#x27;);
  log(&#x27;退货 → &lt;b&gt;权益收回 −30 天&lt;/b&gt;，动态留痕；业务侧订单数 −1&#x27;);}
function reset(){S={click:12,buy:2,act:1,days:60,pending:1,form:&#x27;img&#x27;,n:0};pendingQueue=[&#x27;Wang**&#x27;];activated=[&#x27;Lin**&#x27;,&#x27;Chen**&#x27;];render();$(&#x27;feed&#x27;).querySelectorAll(&#x27;.f.new&#x27;).forEach(function(e){e.remove();});$(&#x27;log&#x27;).innerHTML=&#x27;&lt;span style=&quot;color:var(--faint)&quot;&gt;已重置&lt;/span&gt;&#x27;;$(&#x27;log&#x27;).dataset.x=&#x27;&#x27;;go(&#x27;referral&#x27;);}
render();
&lt;/script&gt;
"></iframe>

<script>
function fit(f){try{var d=f.contentDocument;if(!d||!d.documentElement)return;
  f.style.height=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0)+'px';}catch(e){}}
document.querySelectorAll('iframe').forEach(function(f){
  f.addEventListener('load',function(){fit(f);
    try{new ResizeObserver(function(){fit(f);}).observe(f.contentDocument.documentElement);}catch(e){}
    setTimeout(function(){fit(f);},600);setTimeout(function(){fit(f);},2000);});
});
</script>
