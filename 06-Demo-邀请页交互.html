&lt;section&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;02 · 两版 × 多语言&lt;/div&gt;
  &lt;h2&gt;版本决定做什么，语言决定说什么&lt;/h2&gt;
  &lt;p class=&quot;lede&quot;&gt;这是两个独立的维度，不能合成一个&quot;中文=中国版&quot;。判定版本用 App Store 区 / 账号归属地，不用 IP；语言跟随系统语言，用户可手动改。&lt;/p&gt;
  &lt;div class=&quot;scroll&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;width:150px&quot;&gt;内容&lt;/th&gt;&lt;th style=&quot;width:90px&quot;&gt;归谁管&lt;/th&gt;&lt;th&gt;中国版 CN&lt;/th&gt;&lt;th&gt;国际版 GLOBAL&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;好友利益&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-r&quot;&gt;版本&lt;/span&gt; + 万能层&lt;/td&gt;&lt;td&gt;立减 ¥500（市场层）+ 填码得 1 个月 PRO（万能层），可叠加&lt;/td&gt;&lt;td&gt;$70 off + 1 month Pro with code, stackable&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;邀请人权益&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-r&quot;&gt;版本&lt;/span&gt; + 万能层&lt;/td&gt;&lt;td&gt;每位 30 天 PRO（万能层）→ 3 位 官网券 ¥100 → 5 位 官网券 ¥300（市场层；无券市场退化为 PRO +90 天 / +1 年）&lt;/td&gt;&lt;td&gt;30 days Pro each → 3: $15 store credit → 5: $45 store credit (falls back to +90 days / +1 year Pro where credit is unavailable)&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;成交场&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-r&quot;&gt;版本&lt;/span&gt;&lt;/td&gt;&lt;td&gt;微信小程序商城（主）· 天猫/京东（码）&lt;/td&gt;&lt;td&gt;bodypark.com（Shopify）· Amazon（code）&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;分享去处&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-r&quot;&gt;版本&lt;/span&gt;&lt;/td&gt;&lt;td&gt;图：相册 / 微信好友 / 朋友圈 / 小红书&lt;br&gt;链：复制 / 微信好友 / 更多&lt;/td&gt;&lt;td&gt;Image: Save / Instagram / WhatsApp / Messages&lt;br&gt;Link: Copy / Messages / WhatsApp / More&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;默认形式&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-r&quot;&gt;版本&lt;/span&gt;&lt;/td&gt;&lt;td&gt;图片排前（朋友圈/群图片传播强）&lt;/td&gt;&lt;td&gt;链接排前（iMessage/WhatsApp 对链接友好）&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;邀请码格式&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-r&quot;&gt;版本&lt;/span&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;ALEX-7K2A&lt;/code&gt;（激活时也可填）&lt;/td&gt;&lt;td&gt;&lt;code&gt;ALEX-7K2A&lt;/code&gt;（同一个码，结算 coupon 字段）&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;规则文案&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-r&quot;&gt;版本&lt;/span&gt;&lt;/td&gt;&lt;td&gt;含税务/发票口径、退货收回&lt;/td&gt;&lt;td&gt;含 terms 链接、退货收回&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;页面所有文案&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-l&quot;&gt;语言&lt;/span&gt;&lt;/td&gt;&lt;td colspan=&quot;2&quot;&gt;按 key 走字符串表；金额、天数、昵称作为&lt;b&gt;参数&lt;/b&gt;注入，不写死在句子里&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;昵称脱敏&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-l&quot;&gt;语言&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Lin**（保留姓氏拼音）&lt;/td&gt;&lt;td&gt;Lin W.（名 + 姓首字母）&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;数字与日期&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag t-l&quot;&gt;语言&lt;/span&gt;&lt;/td&gt;&lt;td&gt;09-01 · 30 天 · ¥5,499&lt;/td&gt;&lt;td&gt;Sep 1 · 30 days · $799&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;vc&quot;&gt;&lt;h4&gt;版本管的内容也要多语言&lt;/h4&gt;&lt;p&gt;&quot;配件券 ¥199&quot; 是版本的东西，但它也得有英文。所以版本配置里的字符串本身带语言键：&lt;code&gt;tier3: {zh:&#x27;配件券 ¥199&#x27;, en:&#x27;¥199 accessory credit&#x27;}&lt;/code&gt;。&lt;b&gt;版本 = 一份带语言键的配置，语言 = 选哪个键。&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;vc&quot;&gt;&lt;h4&gt;英文会比中文长 30%~50%&lt;/h4&gt;&lt;p&gt;Hero 两行、CTA 一行、三格数据的标签——这三处最先被撑爆。Demo 里切到 English 就能看到 hero 换行位置和标签行高的变化，设计稿要按&lt;b&gt;英文最长&lt;/b&gt;那一版定容器高度。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;vc&quot;&gt;&lt;h4&gt;权益：万能层 + 市场层&lt;/h4&gt;&lt;p&gt;PRO 天数是唯一能全球无条件发的东西，做底座；官网券依赖该市场官网可售且允许用券，做第 3 / 5 档的里程碑。&lt;b&gt;阶梯形状全球一致，每档奖品由 Profile 配&lt;/b&gt;；券不可用的市场那一档换成 PRO 天数，页面上绝不出现兑不了的权益。右侧&quot;市场层&quot;开关可以看这个退化。&lt;/p&gt;&lt;/div&gt;
    &lt;div class=&quot;vc&quot;&gt;&lt;h4&gt;加一门语言 = 加一列&lt;/h4&gt;&lt;p&gt;字符串表加一列，版本配置里每条带语言键的字符串加一个键，其他不动。日文、韩文、德文都是这个路径。&lt;b&gt;不新增页面，不新增版本。&lt;/b&gt;&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;03 · 单 CTA&lt;/div&gt;
  &lt;h2&gt;页面上只有一个按钮，选择放在按钮之后&lt;/h2&gt;
  &lt;div class=&quot;cols&quot;&gt;
    &lt;div class=&quot;vc&quot;&gt;&lt;h4&gt;为什么&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;页面的任务只有一个：让用户按下去。多一个次级按钮就多一次&quot;我该点哪个&quot;。&lt;/li&gt;&lt;li&gt;形式（图 / 链接）和去处（微信 / 相册 / iMessage…）是&lt;b&gt;同一个决定的两半&lt;/b&gt;，放在同一张面板里一次选完。&lt;/li&gt;&lt;li&gt;邀请码留在页面上但&lt;b&gt;不做成按钮&lt;/b&gt;——它是保底信息，不是动作。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;vc&quot;&gt;&lt;h4&gt;面板结构&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;两组，按版本决定顺序：CN 图片在上，GLOBAL 链接在上。&lt;/li&gt;&lt;li&gt;每组 = 缩略预览 + 一句说明 + 一排去处。去处按版本配置。&lt;/li&gt;&lt;li&gt;&quot;更多&quot;走系统分享面板，兜住所有没列出来的 App。&lt;/li&gt;&lt;li&gt;每个去处都是终点：点完就分享 / 保存 / 复制，面板关掉，toast 确认。&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
    &lt;div class=&quot;vc&quot;&gt;&lt;h4&gt;三格数据可点，但不是 CTA&lt;/h4&gt;&lt;p&gt;点击 / 购买 / 权益三格和&quot;规则&quot;是&lt;b&gt;导航&lt;/b&gt;，不是行动号召——它们把用户带到二级页看东西，不会产生分享。视觉上用卡片而不是按钮，避免和 CTA 争。&lt;/p&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;eyebrow&quot;&gt;04 · 页面要素清单&lt;/div&gt;
  &lt;h2&gt;给设计的任务书&lt;/h2&gt;
  &lt;div class=&quot;scroll&quot;&gt;
    &lt;table&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;width:120px&quot;&gt;区块&lt;/th&gt;&lt;th style=&quot;width:250px&quot;&gt;内容&lt;/th&gt;&lt;th&gt;交互&lt;/th&gt;&lt;th style=&quot;width:70px&quot;&gt;优先级&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;Hero&lt;/b&gt;&lt;/td&gt;&lt;td&gt;利益点两句话（好友得什么 / 我得什么）+ 我的邀请码 + 版本标识&lt;/td&gt;&lt;td&gt;码只展示不做按钮。文案参数化（金额、天数）&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;唯一 CTA&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&quot;邀请好友&quot; / &quot;Invite friends&quot;&lt;/td&gt;&lt;td&gt;拉起分享面板：形式组 × 去处，按版本配置；点去处即完成&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;数据三格&lt;/b&gt;&lt;/td&gt;&lt;td&gt;点击 / 购买 / 权益&lt;/td&gt;&lt;td&gt;点进明细页；数字变化时高亮一次。P0 可不做跳转&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;下一档进度&lt;/b&gt;&lt;/td&gt;&lt;td&gt;&quot;再邀 N 位解锁 ×&quot; + 进度条 + 三档阶梯（按版本）&lt;/td&gt;&lt;td&gt;随购买数实时更新&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;怎么做&lt;/b&gt;&lt;/td&gt;&lt;td&gt;三步，第二步文案按版本（小程序商城 / bodypark.com）&lt;/td&gt;&lt;td&gt;静态&lt;/td&gt;&lt;td&gt;P0&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;规则&lt;/b&gt;&lt;/td&gt;&lt;td&gt;五问五答，按版本&lt;/td&gt;&lt;td&gt;只读&lt;/td&gt;&lt;td&gt;P0（法务）&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;最近动态&lt;/b&gt;&lt;/td&gt;&lt;td&gt;脱敏昵称（按语言规则）+ 事件 + 来源 + 权益状态&lt;/td&gt;&lt;td&gt;新事件置顶高亮&lt;/td&gt;&lt;td&gt;P1&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;邀请明细&lt;/b&gt;&lt;/td&gt;&lt;td&gt;按人（漏斗态）/ 按来源&lt;/td&gt;&lt;td&gt;只读&lt;/td&gt;&lt;td&gt;P1&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;我的权益&lt;/b&gt;&lt;/td&gt;&lt;td&gt;总天数 + 已得列表 + 下一档&lt;/td&gt;&lt;td&gt;只读&lt;/td&gt;&lt;td&gt;P1&lt;/td&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;&lt;b&gt;推送&lt;/b&gt;&lt;/td&gt;&lt;td&gt;好友下单 / 激活 / 权益到账&lt;/td&gt;&lt;td&gt;点击直达邀请页&lt;/td&gt;&lt;td&gt;P1&lt;/td&gt;&lt;/tr&gt;
      &lt;/tbody&gt;
    &lt;/table&gt;
  &lt;/div&gt;
  &lt;div class=&quot;note&quot;&gt;&lt;b&gt;P0 = 邀请页 + 分享面板 + 规则页，两版 × 两语言一起上&lt;/b&gt;——版本和语言是配置不是页面，从第一天就按配置做，后补的成本远高于现在。&lt;/div&gt;
&lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
/* ===================== CONFIG ===================== */

function evClick(){S.click++;renderAll();bump(&#x27;nClick&#x27;);log(&#x27;落地页命中 token 7K2A → &lt;b&gt;点击 +1&lt;/b&gt;&#x27;);}
function evBuy(){var p=people[(S.buy+1)%people.length];S.buy++;pendingQ.push(p);rwList.push({p:p,ok:false});
  markNew({k:&#x27;buy&#x27;,p:p,f:S.lastForm||R().defaultForm});renderAll();bump(&#x27;nBuy&#x27;);push(T().pushBuy(name(p)));
  log(&#x27;订单带 token（或激活填码）→ &lt;b&gt;购买 +1&lt;/b&gt;，权益 &lt;b&gt;待到账&lt;/b&gt;；业务侧&quot;分享带来的订单&quot;+1&#x27;);}
function evActivate(){if(!pendingQ.length){toast(T().noPending);log(&#x27;无待激活订单，先点&quot;好友下单了&quot;&#x27;);return;}
  var p=pendingQ.shift();S.act++;S.days+=30;activated.push(p);
  rwList.forEach(function(x){if(x.p===p&amp;&amp;!x.ok){x.ok=true;x.date=null;}});
  markNew({k:&#x27;act&#x27;,p:p});renderAll();bump(&#x27;nRw&#x27;);push(T().pushAct(name(p)));
  log(&#x27;激活事件 → 权益 &lt;b&gt;已到账 +30 天&lt;/b&gt;，推送通知&#x27;);}
function evRefund(){if(!activated.length){toast(T().noRefund);return;}
  var p=activated.pop();S.buy=Math.max(0,S.buy-1);S.act=Math.max(0,S.act-1);S.days=Math.max(0,S.days-30);
  rwList=rwList.filter(function(x){return x.p!==p;});
  markNew({k:&#x27;refund&#x27;,p:p});renderAll();
  log(&#x27;退货 → &lt;b&gt;权益收回 −30 天&lt;/b&gt;，动态留痕；业务侧订单数 −1&#x27;);}

reset(); go(&#x27;home&#x27;);

<script>
function fit(f){try{var d=f.contentDocument;if(!d||!d.documentElement)return;
  f.style.height=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0)+'px';}catch(e){}}
document.querySelectorAll('iframe').forEach(function(f){
  f.addEventListener('load',function(){fit(f);
    try{new ResizeObserver(function(){fit(f);}).observe(f.contentDocument.documentElement);}catch(e){}
