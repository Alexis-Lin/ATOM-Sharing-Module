    &lt;h3&gt;边界 Case（进验收）&lt;/h3&gt;
    &lt;ul style=&quot;font-size:13.5px;color:var(--muted)&quot;&gt;
      &lt;li&gt;无心率设备 → A1 心率宫格不出现，宫格降档；无 AI 识别 → T3 模板不出现在模板列表。&lt;/li&gt;
      &lt;li&gt;动作列表 &amp;gt; 12 条 → 短图折叠为&quot;+N 个动作&quot;，长图完整展示。&lt;/li&gt;
      &lt;li&gt;无历史数据（首练）→ A3 整体隐藏；自由训练无课程名 → A1 标题降级为&quot;力量训练 · 日期&quot;。&lt;/li&gt;

      &lt;div class=&quot;farrow&quot;&gt;→&lt;/div&gt;

      &lt;div class=&quot;farrow&quot;&gt;→&lt;/div&gt;

  &lt;section&gt;

    &lt;p class=&quot;lede&quot;&gt;这是 FR-2 / FR-3 / FR-4 / FR-5 的活规格：左侧是编辑器控件（即 App 内交互），右侧手机画布实时重排。给设计师的规则都写在控件旁。&lt;/p&gt;

      &lt;div class=&quot;panel&quot;&gt;
        &lt;div class=&quot;pgroup&quot;&gt;

          &lt;div class=&quot;tabs&quot; id=&quot;tplTabs&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;pgroup&quot;&gt;

        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
