          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;region&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;enum&lt;/td&gt;&lt;td&gt;肌肉字典&lt;/td&gt;&lt;td&gt;分区（上肢推/拉、蹲、核心…）有自由度，overlap（背 × 核心）需字典定稿&lt;/td&gt;&lt;/tr&gt;

          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;bodyModel&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;male | female&lt;/td&gt;&lt;td&gt;用户资料&lt;/td&gt;&lt;td&gt;男女版人体模型，默认随用户资料，可切换&lt;/td&gt;&lt;/tr&gt;

          &lt;li&gt;&lt;b&gt;单一肌群&lt;/b&gt;（单动作 E1）→ 切换为 zoom 变体（与 B6 肌肉卡共用该视图）。&lt;/li&gt;
