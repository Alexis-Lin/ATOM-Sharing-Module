  /* atom catalog */

  /* matrix */
  .scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px;background:var(--surface);}
  th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}

  .road{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}

  .oq{counter-reset:q;display:flex;flex-direction:column;gap:10px;}

  .cbox p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.55;}
  .cbox.inst{border-color:var(--heat);}

  .poly{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .poly table{min-width:640px;}
  .poly tbody td{white-space:normal;font-size:12.5px;color:var(--muted);text-align:left;line-height:1.5;}
  .poly tbody th{font-size:13px;}

  /* source→subject binding */
  .bind{display:flex;flex-direction:column;gap:9px;}

  &lt;/header&gt;

  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;核心抽象 / The Model&lt;/div&gt;
    &lt;h2&gt;五层解耦模型&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;每一层正交、可独立替换。“存图 / 甩链接 / 扫码”只是第 ④⑤ 层的不同选择，不改变前三层；新增分享场景只需在 ①② 层配置映射。&lt;/p&gt;
    &lt;div class=&quot;stack&quot; style=&quot;margin-top:26px&quot;&gt;
      &lt;div class=&quot;layer heat-rail&quot;&gt;
        &lt;div class=&quot;rail&quot;&gt;&lt;div class=&quot;node&quot;&gt;1&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;lcard&quot;&gt;&lt;div class=&quot;ltop&quot;&gt;&lt;span class=&quot;lcode&quot;&gt;Subject 分享主体&lt;/span&gt;&lt;span class=&quot;lq&quot;&gt;我在分享“什么”？&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ldesc&quot;&gt;&lt;b&gt;分享源决定主体&lt;/b&gt;——从哪里发起就分享什么，用户无需选择：某次训练 · 某周打卡 · 某个动作 · 某个成就 · 高光火柴人 · 官方内容 · 数据导出。&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;layer heat-rail&quot;&gt;
        &lt;div class=&quot;rail&quot;&gt;&lt;div class=&quot;node&quot;&gt;2&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;lcard&quot;&gt;&lt;div class=&quot;ltop&quot;&gt;&lt;span class=&quot;lcode&quot;&gt;Atom 内容原子&lt;/span&gt;&lt;span class=&quot;lq&quot;&gt;用哪些“积木”表达？&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ldesc&quot;&gt;有限的可复用积木：总结数据 · 动作列表 · 肌肉热力图 · 周期统计 · 火柴人 · 雷达图 · 氛围图……&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;layer&quot;&gt;
        &lt;div class=&quot;rail&quot;&gt;&lt;div class=&quot;node&quot;&gt;3&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;lcard&quot;&gt;&lt;div class=&quot;ltop&quot;&gt;&lt;span class=&quot;lcode&quot;&gt;Assembly 组装模板&lt;/span&gt;&lt;span class=&quot;lq&quot;&gt;积木怎么“排”？&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ldesc&quot;&gt;自由度三级：&lt;b&gt;L1 默认模板&lt;/b&gt;（零配置）→ &lt;b&gt;L2 精选模板 2~4 个&lt;/b&gt;（横滑切换）→ &lt;b&gt;L3 高阶自由勾选&lt;/b&gt;（“自定义”入口）。版式：短图 · 长图 · 卡片。UI 个性化集中在此层。&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;layer&quot;&gt;
        &lt;div class=&quot;rail&quot;&gt;&lt;div class=&quot;node&quot;&gt;4&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;lcard&quot;&gt;&lt;div class=&quot;ltop&quot;&gt;&lt;span class=&quot;lcode&quot;&gt;Carrier 载体格式&lt;/span&gt;&lt;span class=&quot;lq&quot;&gt;以什么“形式”输出？&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ldesc&quot;&gt;&lt;b&gt;四大载体族&lt;/b&gt;：① 图像（社交主力）· ② H5 交互（可下钻、自带引流）· ③ &lt;b&gt;数据 MD/CSV/JSON 🆕&lt;/b&gt;（面向 AI Agent，Pro）· ④ &lt;b&gt;PDF 报告 🆕&lt;/b&gt;（专业存档）。二维码是指向 H5 的入口形态。AI native 时代，分享的接收方不一定是人。&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;layer&quot;&gt;
        &lt;div class=&quot;rail&quot;&gt;&lt;div class=&quot;node&quot;&gt;5&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;lcard&quot;&gt;&lt;div class=&quot;ltop&quot;&gt;&lt;span class=&quot;lcode&quot;&gt;Path 分发链路&lt;/span&gt;&lt;span class=&quot;lq&quot;&gt;怎么“送达”对方？&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ldesc&quot;&gt;A→B 送达 · 平台无感适配尺寸（小红书/IG/微信/Story）· 二维码水印 · 公域 H5 跳转下载。&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;第 ① 层模型 / What Can Be Shared&lt;/div&gt;
    &lt;h2&gt;分享体 = 内容实体 × 用户关系态 &lt;span class=&quot;decided&quot;&gt;✓ 已决策 07-16&lt;/span&gt;&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;同样是“分享一节课”，其实是两个不同的分享体——课程本身（内容），和“这节课被我练过之后”（实例）。任何官方内容都有机会叠加“用户 × 内容”的关系。&lt;/p&gt;
    &lt;div class=&quot;contrast&quot;&gt;
      &lt;div class=&quot;cbox&quot;&gt;&lt;div class=&quot;ct&quot; style=&quot;color:var(--faint)&quot;&gt;R0 · 内容态&lt;/div&gt;&lt;h3&gt;分享课程内容&lt;/h3&gt;
        &lt;p class=&quot;say&quot;&gt;“这节课很好，推荐给你”&lt;/p&gt;&lt;p&gt;展示课程的模板与内容（官方数据）。动力弱，但链公域 H5，&lt;b&gt;引流价值最高&lt;/b&gt;。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;cbox inst&quot;&gt;&lt;div class=&quot;ct&quot; style=&quot;color:var(--heat-ink)&quot;&gt;R1 · 实例态&lt;/div&gt;&lt;h3&gt;分享训练结果&lt;/h3&gt;
        &lt;p class=&quot;say&quot;&gt;“这节课被我练成了这样”&lt;/p&gt;&lt;p&gt;做了几个动作、卡路里、次数与容量（用户 × 内容数据）。&lt;b&gt;分享动力最强&lt;/b&gt;。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;exr&quot; style=&quot;margin-top:22px&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;
          &lt;th&gt;实体 ＼ 关系态&lt;/th&gt;
          &lt;th class=&quot;rhead&quot;&gt;R0&lt;small&gt;内容态 · “这个好”&lt;/small&gt;&lt;/th&gt;
          &lt;th class=&quot;rhead&quot;&gt;R1&lt;small&gt;实例态 · “我练成这样”&lt;/small&gt;&lt;/th&gt;
          &lt;th class=&quot;rhead&quot;&gt;R2&lt;small&gt;聚合态 · “我在成长”&lt;/small&gt;&lt;/th&gt;
          &lt;th class=&quot;rhead&quot;&gt;R3&lt;small&gt;衍生态 · “我达成了”&lt;/small&gt;&lt;/th&gt;
        &lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;th&gt;E1 动作&lt;/th&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E1·R0&lt;/span&gt;&lt;b&gt;动作卡&lt;/b&gt;类武将卡，链公域动作库&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E1·R1&lt;/span&gt;&lt;b&gt;单动作结果&lt;/b&gt;次数/重量/火柴人/AI 点评&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E1·R2&lt;/span&gt;&lt;b&gt;动作历史&lt;/b&gt;历史记录、PB 曲线&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E1·R3&lt;/span&gt;&lt;b&gt;动作徽章&lt;/b&gt;达成/评分&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E2 课程&lt;/th&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E2·R0&lt;/span&gt;&lt;b&gt;课程卡&lt;/b&gt;链公域课程库&lt;/td&gt;
            &lt;td class=&quot;hot&quot;&gt;&lt;span class=&quot;cellcode&quot;&gt;E2·R1 · P0&lt;/span&gt;&lt;b&gt;课后报告&lt;/b&gt;总结+热力图+动作列表&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E2·R2&lt;/span&gt;&lt;b&gt;N 刷趋势&lt;/b&gt;该课成绩变化&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E2·R3&lt;/span&gt;&lt;b&gt;课程评级&lt;/b&gt;A/B/S/SS&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E3 计划/挑战&lt;/th&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E3·R0&lt;/span&gt;&lt;b&gt;计划简介卡&lt;/b&gt;&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E3·R1&lt;/span&gt;&lt;b&gt;某次挑战完成&lt;/b&gt;&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E3·R2&lt;/span&gt;&lt;b&gt;计划进度&lt;/b&gt;&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E3·R3&lt;/span&gt;&lt;b&gt;挑战勋章&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E4 教练/老师&lt;/th&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E4·R0&lt;/span&gt;&lt;b&gt;教练介绍卡&lt;/b&gt;链公域教练主页；未来含 AI 教练&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E4·R1&lt;/span&gt;&lt;b&gt;跟练单次记录&lt;/b&gt;标注教练的一节课&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E4·R2&lt;/span&gt;&lt;b&gt;我 × 教练的关系&lt;/b&gt;累计跟练 N 节 / 时长 / 进步&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E4·R3&lt;/span&gt;&lt;b&gt;师徒里程碑&lt;/b&gt;如跟练 100 节徽章&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E5 肌肉/部位&lt;/th&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E5·R0&lt;/span&gt;&lt;b&gt;肌肉科普卡&lt;/b&gt;解剖 · 相关动作 · 链肌肉字典&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E5·R1&lt;/span&gt;&lt;b&gt;本次练到强度&lt;/b&gt;&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E5·R2&lt;/span&gt;&lt;b&gt;我 × 肌肉的历史&lt;/b&gt;肱二头肌：N 动作 / N 次 / 总容量&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E5·R3&lt;/span&gt;&lt;b&gt;部位专精徽章&lt;/b&gt;如“背部大师”&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E6 器械&lt;/th&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E6·R0&lt;/span&gt;&lt;b&gt;器械介绍卡&lt;/b&gt;用法 · 适配动作&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E6·R1&lt;/span&gt;&lt;b&gt;本次用它练的记录&lt;/b&gt;&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E6·R2&lt;/span&gt;&lt;b&gt;我 × 器械的关系&lt;/b&gt;最爱的哑铃：用过 N 次 · 练过啥&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E6·R3&lt;/span&gt;&lt;b&gt;器械里程碑&lt;/b&gt;如“杠铃 10 吨俱乐部”&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E7 动作模式&lt;/th&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E7·R0&lt;/span&gt;&lt;b&gt;模式科普卡&lt;/b&gt;上肢推/拉 · 蹲 · 髋铰链 · 定义+代表动作&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E7·R1&lt;/span&gt;&lt;b&gt;本次模式分布&lt;/b&gt;“今天全是推”&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E7·R2&lt;/span&gt;&lt;b&gt;我的模式平衡&lt;/b&gt;推拉比 · 容量占比 · 欠练模式&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E7·R3&lt;/span&gt;&lt;b&gt;均衡评级&lt;/b&gt;PPS 六边形徽章&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E0 全局（我）&lt;/th&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E0·R0 · 未来&lt;/span&gt;&lt;b&gt;个人主页&lt;/b&gt;名片 · 照片/视频集 · 成就墙&lt;/td&gt;
            &lt;td&gt;&lt;span class=&quot;cellcode&quot;&gt;E0·R1&lt;/span&gt;&lt;b&gt;单次自由训练&lt;/b&gt;&lt;/td&gt;
            &lt;td class=&quot;hot&quot;&gt;&lt;span class=&quot;cellcode&quot;&gt;E0·R2 · P1&lt;/span&gt;&lt;b&gt;周期打卡&lt;/b&gt;周/月/年 · streak&lt;/td&gt;
            &lt;td class=&quot;hot&quot;&gt;&lt;span class=&quot;cellcode&quot;&gt;E0·R3 · P1&lt;/span&gt;&lt;b&gt;成就&lt;/b&gt;雷达/勋章墙/PB 集&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;
      &lt;span&gt;动力梯度：R1 &amp;gt; R3 ≈ R2 &amp;gt; R0（实例最有动力；内容态动力弱、引流价值最高）&lt;/span&gt;
    &lt;/div&gt;
    &lt;p class=&quot;lede&quot; style=&quot;font-size:13px;margin-top:12px&quot;&gt;高光影像/火柴人动态 = 依附任意 R1 实例的&lt;b&gt;媒体资产&lt;/b&gt;，可切出单独分享；数据导出（给 Agent）= 任意格子换 Markdown/CSV/JSON 载体输出，属第④层&lt;b&gt;数据载体族&lt;/b&gt;，Pro 功能。&lt;br&gt;&lt;b&gt;实体轴是开放的，且分两类&lt;/b&gt;：对象实体（E1~E4，具体的东西/人）与分类实体（E5~E7：肌肉·器械·模式，给动作打标签的维度）。分类实体的 R2 天然是“平衡/覆盖”类叙事（推拉比、肌群热度、器械偏好）——原子化产品的独有优势，别家拿不出“我和这只哑铃的关系”。E7 也是 PPS 六边形、体适能雷达的数据地基。&lt;/p&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;扩展预留 / Health Hub Reserve 🔮&lt;/div&gt;
    &lt;h2&gt;健康域扩展：大一统健康数据中心视角&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;假设未来 Body Park 是统一的健康运动数据中心（对标 Apple Health 14 大类 / Health Connect 6 大类）。检验结论：&lt;b&gt;架构不需要改&lt;/b&gt;——新域接入 = 矩阵加实体行 + 原子目录加 H 系原子；关系态、表现形式、载体、链路全部复用。&lt;/p&gt;

    &lt;div class=&quot;scroll&quot; style=&quot;margin-top:20px&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;text-align:left&quot;&gt;Body Park 域&lt;/th&gt;&lt;th&gt;Apple Health&lt;/th&gt;&lt;th&gt;Health Connect&lt;/th&gt;&lt;th&gt;分享价值&lt;/th&gt;&lt;th&gt;隐私默认&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;th&gt;活动 / 运动&lt;/th&gt;&lt;td&gt;Activity · Workouts · Mobility&lt;/td&gt;&lt;td&gt;Activity&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag ok&quot;&gt;✓ 可分享&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;身体测量&lt;/th&gt;&lt;td&gt;Body Measurements&lt;/td&gt;&lt;td&gt;Body measurements&lt;/td&gt;&lt;td&gt;高（趋势叙事）&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag warn&quot;&gt;⚠ 默认只显趋势&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;营养 / 饮食&lt;/th&gt;&lt;td&gt;Nutrition&lt;/td&gt;&lt;td&gt;Nutrition&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag ok&quot;&gt;✓ 可分享&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;睡眠&lt;/th&gt;&lt;td&gt;Sleep&lt;/td&gt;&lt;td&gt;Sleep&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag ok&quot;&gt;✓ 可分享&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;心肺 / 生命体征&lt;/th&gt;&lt;td&gt;Heart · Vitals · Respiratory&lt;/td&gt;&lt;td&gt;Vitals&lt;/td&gt;&lt;td&gt;中（VO2max 有炫耀价值）&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag warn&quot;&gt;⚠ 谨慎&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;心理 / 正念&lt;/th&gt;&lt;td&gt;Mental Wellbeing&lt;/td&gt;&lt;td&gt;Wellness&lt;/td&gt;&lt;td&gt;低~中&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag warn&quot;&gt;⚠ 谨慎&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;周期&lt;/th&gt;&lt;td&gt;Cycle Tracking&lt;/td&gt;&lt;td&gt;Cycle tracking&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag miss&quot;&gt;🚫 禁止分享&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;医疗类&lt;/th&gt;&lt;td&gt;Medications · Symptoms · Hearing…&lt;/td&gt;&lt;td&gt;（部分入 Vitals）&lt;/td&gt;&lt;td&gt;—&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag miss&quot;&gt;🚫 禁止分享&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;

    &lt;div class=&quot;exr&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;预留实体 ＼ 关系态&lt;/th&gt;&lt;th class=&quot;rhead&quot;&gt;R0&lt;/th&gt;&lt;th class=&quot;rhead&quot;&gt;R1&lt;/th&gt;&lt;th class=&quot;rhead&quot;&gt;R2&lt;/th&gt;&lt;th class=&quot;rhead&quot;&gt;R3&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;th&gt;E8 身体指标&lt;/th&gt;&lt;td&gt;指标科普卡&lt;/td&gt;&lt;td&gt;单次称重（弱）&lt;/td&gt;&lt;td class=&quot;hot&quot;&gt;&lt;b&gt;体重/体脂趋势&lt;/b&gt;变化量优先&lt;/td&gt;&lt;td&gt;减重里程碑&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E9 饮食/膳食&lt;/th&gt;&lt;td&gt;食物/食谱卡&lt;/td&gt;&lt;td class=&quot;hot&quot;&gt;&lt;b&gt;一餐打卡&lt;/b&gt;照片+宏量&lt;/td&gt;&lt;td&gt;营养周报 · 热量收支&lt;/td&gt;&lt;td&gt;连续打卡徽章&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E10 运动会话&lt;/th&gt;&lt;td&gt;运动方式科普卡&lt;/td&gt;&lt;td class=&quot;hot&quot;&gt;&lt;b&gt;单次跑步&lt;/b&gt;路线+配速+心率&lt;/td&gt;&lt;td&gt;月跑量 · 配速趋势&lt;/td&gt;&lt;td&gt;“百公里俱乐部”&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;E11 睡眠&lt;/th&gt;&lt;td&gt;睡眠科普卡&lt;/td&gt;&lt;td class=&quot;hot&quot;&gt;&lt;b&gt;昨晚睡眠&lt;/b&gt;结构图+时长&lt;/td&gt;&lt;td&gt;睡眠周报 · 规律性&lt;/td&gt;&lt;td&gt;早睡/规律徽章&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;legend&quot;&gt;
      &lt;span&gt;三档隐私分级：✓ 默认可分享 · ⚠ 谨慎（默认藏绝对值，主动勾选才外显）· 🚫 禁止（数据中心收录，分享端永不出现）&lt;/span&gt;
    &lt;/div&gt;
    &lt;p class=&quot;lede&quot; style=&quot;font-size:13px;margin-top:12px&quot;&gt;预留原子 H1~H7：体重趋势图 · 营养摘要环 · 饮食打卡卡 · 睡眠结构图 · 运动路线卡 · 活动环/步数 · 心肺摘要。协同效应：大一统数据中心让 &lt;b&gt;Pro 数据导出（给 Agent）&lt;/b&gt;叙事更完整——我们成为聚合方而非被聚合方。&lt;/p&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;第 ② 层规则 / Atom Polymorphism ★&lt;/div&gt;
    &lt;h2&gt;原子的多态性：一个模板，多种数据绑定&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;同一原子在 R0~R3 下版式复用、只换数据绑定——这就是“针对共性模块设计模板”的落点：设计师按原子出模板（标注适配绑定态 + 空状态规则），不是按页面出图；开发侧组件 = &lt;code&gt;template + bindingMode + data&lt;/code&gt;。&lt;/p&gt;
    &lt;div class=&quot;poly&quot; style=&quot;margin-top:20px&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th style=&quot;text-align:left&quot;&gt;原子&lt;/th&gt;&lt;th class=&quot;rhead&quot;&gt;R0 内容态&lt;/th&gt;&lt;th class=&quot;rhead&quot;&gt;R1 实例态&lt;/th&gt;&lt;th class=&quot;rhead&quot;&gt;R2 聚合态&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;th&gt;肌肉热力图&lt;/th&gt;&lt;td&gt;解剖态：主动肌 / 协同肌&lt;/td&gt;&lt;td&gt;本次练到的肌群 × 强度&lt;/td&gt;&lt;td&gt;周期肌群覆盖热度（常练/欠练）&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;总结性指标&lt;/th&gt;&lt;td&gt;官方参数：时长 / 动作数 / 难度&lt;/td&gt;&lt;td&gt;标题 · 日期 · 课程名 · 动作数 · 卡路里 · 容量&lt;/td&gt;&lt;td&gt;累计次数 / 总时长 / 活跃天 / streak&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;动作列表&lt;/th&gt;&lt;td&gt;官方动作编排&lt;/td&gt;&lt;td&gt;我实际完成的组 / 次 / 重&lt;/td&gt;&lt;td&gt;高频动作 Top N&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;th&gt;历史对比&lt;/th&gt;&lt;td class=&quot;void&quot;&gt;—&lt;/td&gt;&lt;td&gt;本次 vs 上次 / vs PB&lt;/td&gt;&lt;td&gt;趋势曲线&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;第 ① 层规则 / Source → Subject&lt;/div&gt;
    &lt;h2&gt;分享源决定主体 &lt;span class=&quot;decided&quot;&gt;✓ 已决策 07-16&lt;/span&gt;&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;从哪里发起分享，就分享什么——主体由发起位置隐式决定，用户永远不需要先“选择我要分享什么”。&lt;/p&gt;
    &lt;p class=&quot;lede&quot; style=&quot;font-size:13px;margin-top:8px&quot;&gt;当分享源同时命中两个关系态（动作详情页里既有官方内容又有我的历史），默认取用户数据态，提供轻量切换。&lt;/p&gt;
    &lt;div class=&quot;bind&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;动作库 · 动作详情页&lt;/b&gt;(a)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E1·R0 动作卡&lt;br&gt;&lt;span class=&quot;atoms-hint&quot;&gt;有历史可切 E1·R2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;动作卡 + 热力图(解剖态)&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;某节课页面&lt;/b&gt;(b)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E2·R0 课程卡&lt;br&gt;&lt;span class=&quot;atoms-hint&quot;&gt;练过可切 E2·R1/R2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;课程卡&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;课后报告 / 训练记录&lt;/b&gt;(c)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E2·R1 课后报告&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;总结数据 + 热力图 + 动作列表&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;影像记录 / 高光火柴人动态&lt;/b&gt;(d)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;R1 附属媒体资产&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;AI 火柴人 + 高光视频&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;周期统计页（周/月/年）&lt;/b&gt;(e)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E0·R2 周期打卡&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;周期统计 + 历史对比&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;成就 / PB / 雷达页&lt;/b&gt;(f)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E0·R3 成就&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;成就标识 / 雷达图&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;已训练动作 · 历史记录页&lt;/b&gt;(g)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E1·R2 动作历史&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;历史曲线 + PB&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;教练主页 / 课程页教练区&lt;/b&gt;(h)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E4·R0 教练卡&lt;br&gt;&lt;span class=&quot;atoms-hint&quot;&gt;有跟练史可切 E4·R2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;教练卡 + 师徒关系数据&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;个人主页（未来）&lt;/b&gt;(i)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E0·R0 个人主页&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;名片 + 成就墙 + 照片/视频集&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;肌肉字典 / 肌群详情页&lt;/b&gt;(j)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E5·R0 肌肉卡&lt;br&gt;&lt;span class=&quot;atoms-hint&quot;&gt;有训练史可切 E5·R2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;肌肉卡 + 热力图(解剖态) + 历史&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;器械详情页&lt;/b&gt;(k)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E6·R0 器械卡&lt;br&gt;&lt;span class=&quot;atoms-hint&quot;&gt;用过可切 E6·R2&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;器械卡 + 使用历史&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;brow&quot;&gt;&lt;div class=&quot;src&quot;&gt;&lt;b&gt;模式统计 / 体适能报告视图&lt;/b&gt;(l)&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;subject&quot;&gt;E7·R2 模式平衡&lt;/div&gt;&lt;div class=&quot;atoms-hint&quot;&gt;模式卡（PPS 六边形 / 推拉比）&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;lede&quot; style=&quot;font-size:13px;margin-top:14px&quot;&gt;注：火柴人既是“课后报告”里的可选&lt;b&gt;原子&lt;/b&gt;，也因入口 (d) 可作为媒体资产单独分享——同一积木，两种调用，正是原子化架构的意义。&lt;/p&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;第 ③ 层规则 / Freedom Tiers&lt;/div&gt;
    &lt;h2&gt;主体内自由度三级 &lt;span class=&quot;decided&quot;&gt;✓ 已决策 07-16&lt;/span&gt;&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;主体内的组合“一定程度自由，但尽量保持简单”——渐进式披露：普通用户零决策，高阶用户有出口。模板 = 预设的原子勾选状态 + 版式，L2 与 L3 底层同构，代码只有一套。&lt;/p&gt;
    &lt;div class=&quot;tiers&quot;&gt;
      &lt;div class=&quot;tier&quot;&gt;&lt;div class=&quot;tl&quot;&gt;L1 · Default&lt;/div&gt;&lt;h3&gt;默认模板&lt;/h3&gt;&lt;p&gt;发起分享即出图，替用户做好强意见决策。&lt;/p&gt;&lt;div class=&quot;cost&quot;&gt;决策成本 · 0 步&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;tier&quot;&gt;&lt;div class=&quot;tl&quot;&gt;L2 · Curated&lt;/div&gt;&lt;h3&gt;精选模板 2~4 个&lt;/h3&gt;&lt;p&gt;每主体预设几个常见原子组合 + 版式，横滑切换。&lt;/p&gt;&lt;div class=&quot;cost&quot;&gt;决策成本 · 1 步&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;tier&quot;&gt;&lt;div class=&quot;tl&quot;&gt;L3 · Custom&lt;/div&gt;&lt;h3&gt;高阶自由勾选&lt;/h3&gt;&lt;p&gt;菜单式勾选原子，入口收敛在模板列表末位“自定义”。&lt;/p&gt;&lt;div class=&quot;cost&quot;&gt;决策成本 · N 步 · 自愿进入&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;第 ③ 层词汇 / Format Vocabulary&lt;/div&gt;
    &lt;h2&gt;表现形式词汇表&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;原子渲染时可用的表现形式是有限词汇，与数据绑定正交：形式决定“长什么样”，绑定决定“装什么数据”。模板 = 原子组合 × 每个原子选定的形式。&lt;/p&gt;
    &lt;div class=&quot;atoms&quot; style=&quot;margin-top:18px&quot;&gt;
      &lt;div class=&quot;atom&quot;&gt;&lt;div class=&quot;an&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--heat)&quot;&gt;&lt;/span&gt;数字 Number&lt;/div&gt;&lt;div class=&quot;ad&quot;&gt;大数字 · 宫格指标 · 计数 —— A1 A2&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;atom&quot;&gt;&lt;div class=&quot;an&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--heat)&quot;&gt;&lt;/span&gt;图表 Chart&lt;/div&gt;&lt;div class=&quot;ad&quot;&gt;趋势线 · 对比条 · 雷达 · 热力着色 —— A3 C3 B2&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;atom&quot;&gt;&lt;div class=&quot;an&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--miss)&quot;&gt;&lt;/span&gt;照片 Photo&lt;/div&gt;&lt;div class=&quot;ad&quot;&gt;氛围图 · 自拍 · 封面 —— D1 B3 B4&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;atom&quot;&gt;&lt;div class=&quot;an&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--miss)&quot;&gt;&lt;/span&gt;视频 Video&lt;/div&gt;&lt;div class=&quot;ad&quot;&gt;高光片段 · 动态回放 —— D2&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;atom&quot;&gt;&lt;div class=&quot;an&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--warn)&quot;&gt;&lt;/span&gt;徽章 Badge&lt;/div&gt;&lt;div class=&quot;ad&quot;&gt;勋章 · 评级字母 · 里程碑 —— C4&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;atom&quot;&gt;&lt;div class=&quot;an&quot;&gt;&lt;span class=&quot;dot&quot; style=&quot;background:var(--warn)&quot;&gt;&lt;/span&gt;可视化指标 Visual Metric&lt;/div&gt;&lt;div class=&quot;ad&quot;&gt;进度环 · 六边形 PPS · 打卡点阵 —— C4 A2&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;atom diff&quot;&gt;&lt;div class=&quot;an&quot;&gt;数字人 Digital Human&lt;/div&gt;&lt;div class=&quot;ad&quot;&gt;火柴人姿态 · 未来 3D avatar / 数字分身 —— C1&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;第 ① 层 / Priority&lt;/div&gt;
    &lt;h2&gt;分享体优先级&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;R1 实例态动力最强（每次都不同、最像健身房打卡）；R0 内容态动力最弱但引流价值最高。→ 先做课后报告，再补其余。&lt;/p&gt;
    &lt;div class=&quot;grid g2&quot; style=&quot;margin-top:22px&quot;&gt;
      &lt;div class=&quot;card subj&quot;&gt;&lt;div class=&quot;st&quot;&gt;&lt;h3&gt;课后报告 &lt;span class=&quot;atoms-hint mono&quot;&gt;E2·R1&lt;/span&gt;&lt;/h3&gt;&lt;span class=&quot;pri p0&quot;&gt;P0&lt;/span&gt;&lt;/div&gt;
        &lt;p&gt;练完一节课 / 一次 workout 的结果&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag ok&quot;&gt;✓ 已有（较简陋）&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;高意愿&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card subj&quot;&gt;&lt;div class=&quot;st&quot;&gt;&lt;h3&gt;周期打卡 &lt;span class=&quot;atoms-hint mono&quot;&gt;E0·R2&lt;/span&gt;&lt;/h3&gt;&lt;span class=&quot;pri p1&quot;&gt;P1&lt;/span&gt;&lt;/div&gt;
        &lt;p&gt;7 天 / 本月 / 今年累计的统计概览&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag miss&quot;&gt;缺&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;高意愿&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card subj&quot;&gt;&lt;div class=&quot;st&quot;&gt;&lt;h3&gt;单动作结果与历史 &lt;span class=&quot;atoms-hint mono&quot;&gt;E1·R1/R2&lt;/span&gt;&lt;/h3&gt;&lt;span class=&quot;pri p1&quot;&gt;P1&lt;/span&gt;&lt;/div&gt;
        &lt;p&gt;某动作本次表现 + 历史记录 / PB&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag miss&quot;&gt;缺&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;中意愿&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card subj&quot;&gt;&lt;div class=&quot;st&quot;&gt;&lt;h3&gt;成就 / 里程碑 &lt;span class=&quot;atoms-hint mono&quot;&gt;E0·R3&lt;/span&gt;&lt;/h3&gt;&lt;span class=&quot;pri p1&quot;&gt;P1&lt;/span&gt;&lt;/div&gt;
        &lt;p&gt;PB · 勋章 · 评级 · 体适能雷达升级&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag miss&quot;&gt;缺 · 依赖功能补全&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;高意愿&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card subj&quot;&gt;&lt;div class=&quot;st&quot;&gt;&lt;h3&gt;R1 附属媒体（高光/火柴人）&lt;/h3&gt;&lt;span class=&quot;pri p2&quot;&gt;P2&lt;/span&gt;&lt;/div&gt;
        &lt;p&gt;自拍氛围图 · 高光动作视频&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag warn&quot;&gt;部分&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;中意愿&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card subj&quot;&gt;&lt;div class=&quot;st&quot;&gt;&lt;h3&gt;官方内容卡 &lt;span class=&quot;atoms-hint mono&quot;&gt;E1/E2·R0&lt;/span&gt;&lt;/h3&gt;&lt;span class=&quot;pri p2&quot;&gt;P2&lt;/span&gt;&lt;/div&gt;
        &lt;p&gt;动作卡 / 课程卡，落公域 H5&lt;/p&gt;&lt;div class=&quot;tags&quot;&gt;&lt;span class=&quot;tag miss&quot;&gt;缺&lt;/span&gt;&lt;span class=&quot;tag&quot;&gt;低意愿 · 高引流&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;

    &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;非目标（本期不做）&lt;/b&gt;：公域 H5 与链接/二维码载体（Phase 4）· 单动作/周期/教练/官方内容分享（Phase 3）· 成就体系与雷达外化（依赖功能补全，占位）· Agent 数据导出（Pro，另立项）。&lt;/div&gt;
  &lt;/section&gt;

  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;02 / 功能需求&lt;/div&gt;
    &lt;h2&gt;需求清单（P0 切片）&lt;/h2&gt;
    &lt;div class=&quot;scroll&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;需求&lt;/th&gt;&lt;th&gt;说明 / 验收要点&lt;/th&gt;&lt;th&gt;优先级&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;FR-1&lt;/td&gt;&lt;td&gt;&lt;b&gt;分享入口&lt;/b&gt;&lt;/td&gt;&lt;td&gt;课后报告页 / 训练记录详情页常驻分享按钮；分享体由入口隐式绑定（E2·R1），用户无需选择&quot;分享什么&quot;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag p0&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;FR-2&lt;/td&gt;&lt;td&gt;&lt;b&gt;模板选择（L1/L2）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;进入即渲染 T1 默认模板（零配置可直接发）；横滑切换 T1~T4（定义见 规范-分享模板总目录）；末位入口&quot;自定义&quot;&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag p0&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;FR-3&lt;/td&gt;&lt;td&gt;&lt;b&gt;自定义勾选（L3）&lt;/b&gt;&lt;/td&gt;&lt;td&gt;菜单式勾选原子，勾选即显示、取消即隐藏并重排；G1 水印必带不可取消&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag p0&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;FR-4&lt;/td&gt;&lt;td&gt;&lt;b&gt;满格规则&lt;/b&gt;&lt;/td&gt;&lt;td&gt;任一原子无数据：自动隐藏 + 版面重排，禁止出现 0/—/空宫格；A1 宫格按可用字段 3/4/6 档降级&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag must&quot;&gt;必须&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;FR-5&lt;/td&gt;&lt;td&gt;&lt;b&gt;平台尺寸适配&lt;/b&gt;&lt;/td&gt;&lt;td&gt;短图默认 3:4；选择渠道自动切：小红书 3:4 / IG 1:1 / Story 9:16；长图不限高、宽度统一&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag p0&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;FR-6&lt;/td&gt;&lt;td&gt;&lt;b&gt;导出与分发&lt;/b&gt;&lt;/td&gt;&lt;td&gt;生成图片→系统分享面板 / 保存相册；图底 G1 品牌水印+二维码（本期二维码落 App 下载页）&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag p0&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;FR-7&lt;/td&gt;&lt;td&gt;&lt;b&gt;氛围图兜底&lt;/b&gt;&lt;/td&gt;&lt;td&gt;D1 支持用户上传；未上传时从系统配图池自动配图，不出现空位&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag p0&quot;&gt;P0&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td class=&quot;mono&quot;&gt;FR-8&lt;/td&gt;&lt;td&gt;&lt;b&gt;埋点&lt;/b&gt;&lt;/td&gt;&lt;td&gt;share_initiated / template_switched / atom_toggled / share_completed(渠道) / qr_scanned&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;tag must&quot;&gt;必须&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;h3&gt;边界 Case（进验收）&lt;/h3&gt;
    &lt;ul style=&quot;font-size:13.5px;color:var(--muted)&quot;&gt;
      &lt;li&gt;无心率设备 → A1 心率宫格不出现，宫格降档；无 AI 识别 → T3 模板不出现在模板列表。&lt;/li&gt;
      &lt;li&gt;动作列表 &amp;gt; 12 条 → 短图折叠为&quot;+N 个动作&quot;，长图完整展示。&lt;/li&gt;
      &lt;li&gt;无历史数据（首练）→ A3 整体隐藏；自由训练无课程名 → A1 标题降级为&quot;力量训练 · 日期&quot;。&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/section&gt;

  &lt;!-- ========== 2 interactive logic ========== --&gt;
  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;03 / 逻辑图（可交互）&lt;/div&gt;
    &lt;h2&gt;分享链路：源 → 分享体 → 模板 → 载体&lt;/h2&gt;

    &lt;div class=&quot;srcchips&quot; id=&quot;srcChips&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;flow&quot;&gt;
      &lt;div class=&quot;fnode hot&quot;&gt;&lt;span class=&quot;fk&quot;&gt;① 分享源 Source&lt;/span&gt;&lt;span class=&quot;fv&quot; id=&quot;fSrc&quot;&gt;课后报告 / 训练记录&lt;/span&gt;&lt;span class=&quot;fd&quot; id=&quot;fSrcD&quot;&gt;用户练完一节课，在报告页点分享&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;farrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;fnode hot&quot;&gt;&lt;span class=&quot;fk&quot;&gt;② 分享体 Subject&lt;/span&gt;&lt;span class=&quot;fv mono&quot; id=&quot;fCell&quot;&gt;E2·R1 课后报告&lt;/span&gt;&lt;span class=&quot;fd&quot; id=&quot;fCellD&quot;&gt;实例态：这节课被我练成了这样&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;farrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;fnode&quot;&gt;&lt;span class=&quot;fk&quot;&gt;③ 默认原子 → 模板&lt;/span&gt;&lt;span class=&quot;fv mono&quot; id=&quot;fAtoms&quot;&gt;A1 + B2 + B1 + G1&lt;/span&gt;&lt;span class=&quot;fd&quot; id=&quot;fAtomsD&quot;&gt;L1 默认 T1；L2 横滑 T1~T4；L3 自定义勾选&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;farrow&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;fnode&quot;&gt;&lt;span class=&quot;fk&quot;&gt;④ 载体 Carrier&lt;/span&gt;&lt;span class=&quot;fv&quot; id=&quot;fCar&quot;&gt;图片（+水印二维码）&lt;/span&gt;&lt;span class=&quot;fd&quot; id=&quot;fCarD&quot;&gt;平台尺寸自动适配；H5/QR 属 Phase 4&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;prinote&quot; id=&quot;fPri&quot;&gt;优先级：P0 · 本期范围 ✓&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ========== 3 interactive wireframe ========== --&gt;
  &lt;section&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;04 / 线框图（可交互 · 分享编辑器）&lt;/div&gt;
    &lt;h2&gt;试玩产品逻辑：切模板 · 勾原子 · 换尺寸&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;这是 FR-2 / FR-3 / FR-4 / FR-5 的活规格：左侧是编辑器控件（即 App 内交互），右侧手机画布实时重排。给设计师的规则都写在控件旁。&lt;/p&gt;

    &lt;div class=&quot;studio&quot;&gt;
      &lt;div class=&quot;panel&quot;&gt;
        &lt;div class=&quot;pgroup&quot;&gt;
          &lt;div class=&quot;pk&quot;&gt;模板 L1/L2 · 横滑切换（FR-2）&lt;/div&gt;
          &lt;div class=&quot;tabs&quot; id=&quot;tplTabs&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;pgroup&quot;&gt;
          &lt;div class=&quot;pk&quot;&gt;原子勾选 L3（FR-3 · 勾=显示 / 去勾=隐藏重排）&lt;/div&gt;
          &lt;div class=&quot;achk&quot; id=&quot;atomChips&quot;&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;pgroup&quot;&gt;
          &lt;div class=&quot;pk&quot;&gt;渠道尺寸（FR-5 · 用户无感自动切）&lt;/div&gt;

        &lt;div class=&quot;callout&quot; style=&quot;margin:0&quot;&gt;&lt;b&gt;设计规则&lt;/b&gt;：G1 必带不可取消；用户改动勾选后模板态变为「自定义」；T3 仅当本次训练有 AI 识别数据时出现；切尺寸只改画布裁切与排版密度，不改内容。&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;stage&quot;&gt;
        &lt;div class=&quot;canvaswrap&quot;&gt;&lt;div class=&quot;phone ratio-34&quot; id=&quot;canvas&quot;&gt;&lt;/div&gt;&lt;/div&gt;

      &lt;/div&gt;
    &lt;/div&gt;

  &lt;!-- ========== 4 screens ========== --&gt;

    &lt;div class=&quot;screens&quot;&gt;
      &lt;div class=&quot;screen&quot;&gt;
        &lt;div class=&quot;schead&quot;&gt;&lt;span class=&quot;scnum&quot;&gt;S1&lt;/span&gt;&lt;b&gt;课后报告页（入口）&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;scframe&quot;&gt;

          &lt;div class=&quot;btncapsule&quot;&gt;分享战报&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;scnote&quot;&gt;FR-1：常驻按钮；点击即带上下文（sessionId）进入编辑器 —— 分享体已被入口决定，无&quot;选择分享什么&quot;步骤&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;screen&quot;&gt;
        &lt;div class=&quot;schead&quot;&gt;&lt;span class=&quot;scnum&quot;&gt;S2&lt;/span&gt;&lt;b&gt;分享编辑器&lt;/b&gt;&lt;/div&gt;
        &lt;div class=&quot;scframe&quot;&gt;
          &lt;div class=&quot;navbar&quot;&gt;&lt;div class=&quot;ph&quot; style=&quot;width:14px&quot;&gt;&lt;/div&gt;&lt;div style=&quot;flex:1&quot;&gt;&lt;/div&gt;&lt;span class=&quot;lbl&quot;&gt;分享&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;blk grow&quot; style=&quot;border-style:solid&quot;&gt;&lt;span class=&quot;lbl&quot; style=&quot;text-align:center&quot;&gt;画布预览（上方 04 节可交互）&lt;/span&gt;&lt;div class=&quot;ph l&quot; style=&quot;margin:0 auto&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ph m&quot; style=&quot;margin:0 auto&quot;&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;row&quot; style=&quot;justify-content:center;gap:5px&quot;&gt;&lt;span class=&quot;chipk&quot;&gt;T1&lt;/span&gt;&lt;span class=&quot;lbl&quot;&gt;T2 · T3 · T4 · 自定义&lt;/span&gt;&lt;/div&gt;

        &lt;/div&gt;

      &lt;div class=&quot;card&quot;&gt;
        &lt;h3 style=&quot;margin-top:0&quot;&gt;埋点与指标&lt;/h3&gt;
        &lt;ul style=&quot;font-size:13.5px;color:var(--muted)&quot;&gt;

        &lt;/ul&gt;

        &lt;h3 style=&quot;margin-top:0&quot;&gt;里程碑（对应工程 M1~M2）&lt;/h3&gt;
        &lt;ul style=&quot;font-size:13.5px;color:var(--muted)&quot;&gt;

          &lt;li&gt;Phase 3/4（单动作、周期、公域 H5）按数据表现排期&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;待评审确认&lt;/b&gt;：① 肌肉热力图是否含侧面视图/男女版（影响 B2 规格）② T2~T4 的原子预设是否如本 PRD ③ 双态分享源（动作页等）默认取用户数据态的规则 ④ 二维码本期落下载页的临时方案。&lt;/div&gt;
