  &lt;section id=&quot;s1&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;① 分享体系怎么做&lt;/div&gt;
    &lt;h2&gt;原子化：排列组合无穷，底层积木有限&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;整个体系建立在一个判断上——如果按&quot;页面&quot;做分享，每加一个场景就要重做一次；如果按&quot;积木&quot;做分享，场景是积木的排列组合，一套代码覆盖全部。&lt;/p&gt;

    &lt;div class=&quot;quote&quot;&gt;&quot;你最后排列组合是无穷的，但是它最下面那一个个原子模块模板是有限的。我们现在就是把所有这些原子模块找出来。&quot;
      &lt;small&gt;—— 2026-07-16 架构讨论会&lt;/small&gt;&lt;/div&gt;

    &lt;div class=&quot;grid g3&quot; style=&quot;margin-top:20px&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;① 有限的积木&lt;/h3&gt;&lt;p style=&quot;color:var(--muted);font-size:13.5px;margin:0&quot;&gt;找出全部内容原子（总结指标、肌肉热力图、动作列表、火柴人…），每个原子只设计一次、只实现一次。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;② 无限的组合&lt;/h3&gt;&lt;p style=&quot;color:var(--muted);font-size:13.5px;margin:0&quot;&gt;模板 = 一组预设的原子组合 + 版式。新增分享场景 = 配一份模板 JSON，不写新代码、不出新设计。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;h3 style=&quot;margin-top:0&quot;&gt;③ 解耦的分层&lt;/h3&gt;&lt;p style=&quot;color:var(--muted);font-size:13.5px;margin:0&quot;&gt;内容、样式、载体三件事互不影响：换一种输出格式（图/链接/数据），前面两层完全不动。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;五层解耦模型（点任意一层看它的选项）&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;从&quot;分享什么&quot;到&quot;怎么送达&quot;，五层各自独立可替换。这是整个体系的骨架。&lt;/p&gt;
    &lt;div class=&quot;stack&quot; id=&quot;layerStack&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;ldetail&quot; id=&quot;layerDetail&quot;&gt;&lt;/div&gt;

    &lt;h3&gt;什么可以被分享：实体 × 关系态&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;同样是&quot;分享一节课&quot;其实是两件事——分享&lt;b&gt;课程本身&lt;/b&gt;（推荐给你）和分享&lt;b&gt;我练完这节课的结果&lt;/b&gt;（我练成这样）。把这个区分推广开，任何内容都能叠加&quot;用户 × 内容&quot;的关系，于是全部可分享内容变成一张矩阵。&lt;b&gt;点格子看详情。&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;mx&quot; style=&quot;margin-top:16px&quot;&gt;&lt;table id=&quot;mxTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;cellinfo&quot; id=&quot;cellInfo&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;为什么这张矩阵重要&lt;/b&gt;：它既是需求清单（每个格子都是一个可做的分享场景），也是扩展规则——产品里新增任何&quot;名词&quot;（新器械类型、新健康数据域），补一行关系态就自动获得完整分享能力。&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ==================== ② ==================== --&gt;
  &lt;section id=&quot;s2&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;② 分享路径与分享形式&lt;/div&gt;
    &lt;h2&gt;用户从哪进来，最后以什么形式出去&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;一次分享 = &lt;b&gt;路径&lt;/b&gt;（从哪发起 → 分享什么 → 用哪个模板）+ &lt;b&gt;形式&lt;/b&gt;（以什么载体输出）。两者正交：同一条路径可以输出成四种形式。&lt;/p&gt;

    &lt;h3&gt;路径规则：分享源决定分享体&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;用户永远不需要先回答&quot;我要分享什么&quot;——他从哪个页面点的分享，就已经回答了。这省掉了一整步交互。&lt;b&gt;点任意入口看完整链路。&lt;/b&gt;&lt;/p&gt;
    &lt;div class=&quot;tabs&quot; id=&quot;srcTabs&quot; style=&quot;margin-top:16px&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;flowbox&quot; id=&quot;flowBox&quot;&gt;&lt;/div&gt;

    &lt;h3&gt;组合自由度：三级渐进&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;普通用户零决策，高阶用户有出口——模板本质就是&quot;预设好的原子勾选状态&quot;，所以三级底层是同一套东西。&lt;/p&gt;
    &lt;div class=&quot;grid g3&quot; style=&quot;margin-top:14px&quot;&gt;
      &lt;div class=&quot;card tier&quot;&gt;&lt;div class=&quot;tl&quot;&gt;L1 · DEFAULT&lt;/div&gt;&lt;h3 style=&quot;margin:4px 0 3px&quot;&gt;默认模板&lt;/h3&gt;&lt;p style=&quot;color:var(--muted);font-size:13px;margin:0&quot;&gt;进入分享页即渲染完毕，直接可发。&lt;/p&gt;&lt;div class=&quot;cost&quot;&gt;决策成本 0 步&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card tier&quot;&gt;&lt;div class=&quot;tl&quot;&gt;L2 · CURATED&lt;/div&gt;&lt;h3 style=&quot;margin:4px 0 3px&quot;&gt;精选模板 2~4 个&lt;/h3&gt;&lt;p style=&quot;color:var(--muted);font-size:13px;margin:0&quot;&gt;横滑切换不同风格与信息量。&lt;/p&gt;&lt;div class=&quot;cost&quot;&gt;决策成本 1 步&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;card tier&quot;&gt;&lt;div class=&quot;tl&quot;&gt;L3 · CUSTOM&lt;/div&gt;&lt;h3 style=&quot;margin:4px 0 3px&quot;&gt;自由勾选原子&lt;/h3&gt;&lt;p style=&quot;color:var(--muted);font-size:13px;margin:0&quot;&gt;入口收在模板列表末位&quot;自定义&quot;。&lt;/p&gt;&lt;div class=&quot;cost&quot;&gt;决策成本 N 步 · 自愿进入&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3 id=&quot;carriers&quot;&gt;分享形式：四大载体族 🆕&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;过去讨论集中在图片。但在 AI native 时代，分享的接收方&lt;b&gt;不一定是人&lt;/b&gt;——也可能是用户自己的 AI agent。同一份训练数据，应该能以四种形式出去。&lt;b&gt;点标签切换载体，看同一次训练的四种形态。&lt;/b&gt;&lt;/p&gt;

    &lt;div class=&quot;grid g4&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;cf&quot;&gt;① 图像 Image&lt;/div&gt;&lt;p class=&quot;cd&quot;&gt;面向&lt;b&gt;人 · 社交&lt;/b&gt;。零门槛、全平台适配，即时晒图的绝对主力。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;cf&quot;&gt;② 交互 H5&lt;/div&gt;&lt;p class=&quot;cd&quot;&gt;面向&lt;b&gt;人 · 深度&lt;/b&gt;。可下钻、可播放、可更新，自带 App 引流入口。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-color:var(--acc)&quot;&gt;&lt;div class=&quot;cf&quot; style=&quot;color:var(--acc-ink)&quot;&gt;③ 数据 Data 🆕&lt;/div&gt;&lt;p class=&quot;cd&quot;&gt;面向 &lt;b&gt;AI / Agent&lt;/b&gt;。Markdown / CSV / JSON，机器可解析，喂给用户自己的 agent。&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-color:var(--acc)&quot;&gt;&lt;div class=&quot;cf&quot; style=&quot;color:var(--acc-ink)&quot;&gt;④ 文档 PDF 🆕&lt;/div&gt;&lt;p class=&quot;cd&quot;&gt;面向&lt;b&gt;人 · 专业&lt;/b&gt;。打印级图表报告，给教练、医生或自己存档。&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;carrierdemo&quot;&gt;
      &lt;div class=&quot;tabs&quot; id=&quot;carTabs&quot;&gt;&lt;/div&gt;
      &lt;div class=&quot;carstage&quot;&gt;
        &lt;div class=&quot;carview&quot; id=&quot;carView&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;carnote&quot; id=&quot;carNote&quot;&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;callout&quot; style=&quot;margin-top:20px&quot;&gt;&lt;b&gt;为什么数据类载体值得做&lt;/b&gt;：会议里提到的真实用户——&quot;身上戴着一堆设备，所有能吐数据的 App 都用，全喂给自己的 agent 做长寿分析&quot;。这类用户不需要好看的图，需要机器可读的结构化数据。我们做导出，意味着在他的健康数据中枢里&lt;b&gt;我们是数据源而不是数据孤岛&lt;/b&gt;；结合大一统健康中心的设想，我们甚至可以成为&lt;b&gt;聚合方&lt;/b&gt;。商业上作为 Pro 功能，普通用户无感，专业用户愿意付费。&lt;/div&gt;

    &lt;h3&gt;载体 × 分享体 适配矩阵&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;规律：&lt;b&gt;越是聚合、长期的数据，数据类与文档类载体价值越高&lt;/b&gt;；越是单次、情绪化的内容，图像载体越强。&lt;/p&gt;
    &lt;div class=&quot;scroll&quot; style=&quot;margin-top:14px&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;分享体&lt;/th&gt;&lt;th style=&quot;text-align:center&quot;&gt;图像&lt;/th&gt;&lt;th style=&quot;text-align:center&quot;&gt;H5 交互&lt;/th&gt;&lt;th style=&quot;text-align:center&quot;&gt;数据导出&lt;/th&gt;&lt;th style=&quot;text-align:center&quot;&gt;PDF 报告&lt;/th&gt;&lt;th&gt;说明&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody id=&quot;carMatrix&quot;&gt;&lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ==================== 报告与洞察 ==================== --&gt;
  &lt;section id=&quot;s25&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;②.5 报告与洞察 ★ 分享动机的核心&lt;/div&gt;
    &lt;h2&gt;数据回答&quot;我做了什么&quot;，洞察回答&quot;这意味着什么&quot;&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;课后训练报告是最重要的分享场景族。但真正让用户想分享的不是数据本身——竞品都有数据——而是&lt;b&gt;一个让他惊讶或自豪的判断&lt;/b&gt;。这决定了报告该怎么设计。&lt;/p&gt;

    &lt;div class=&quot;grid g3&quot; style=&quot;margin-top:18px&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;cf&quot; style=&quot;color:var(--faint)&quot;&gt;L1 陈述&lt;/div&gt;&lt;p class=&quot;cd&quot;&gt;&quot;你练了 42 分钟，消耗 386 千卡&quot;&lt;br&gt;&lt;span style=&quot;font-family:var(--mono);font-size:11px;color:var(--faint)&quot;&gt;所有 App 都有 · 零分享动机&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;cf&quot; style=&quot;color:var(--muted)&quot;&gt;L2 比较&lt;/div&gt;&lt;p class=&quot;cd&quot;&gt;&quot;比上次多举 12%，超过 88% 同课学员&quot;&lt;br&gt;&lt;span style=&quot;font-family:var(--mono);font-size:11px;color:var(--faint)&quot;&gt;多数 App 能做 · 有一定动机&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;card&quot; style=&quot;border-color:var(--acc)&quot;&gt;&lt;div class=&quot;cf&quot; style=&quot;color:var(--acc-ink)&quot;&gt;L3 判断 ★&lt;/div&gt;&lt;p class=&quot;cd&quot;&gt;&quot;进步来自组数 +2 而非重量——下次可试 65kg&quot;&lt;br&gt;&lt;span style=&quot;font-family:var(--mono);font-size:11px;color:var(--acc-ink)&quot;&gt;我们的差异化 · 这才是 wow&lt;/span&gt;&lt;/p&gt;&lt;/div&gt;
    &lt;/div&gt;

    &lt;h3&gt;报告的四个粒度&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;&quot;课后报告&quot;不是一个格子而是一族，粒度越小越偏即时质量反馈，越大越偏成长归因。&lt;/p&gt;
    &lt;div class=&quot;scroll&quot; style=&quot;margin-top:14px&quot;&gt;
      &lt;table&gt;
        &lt;thead&gt;&lt;tr&gt;&lt;th&gt;粒度&lt;/th&gt;&lt;th&gt;格子&lt;/th&gt;&lt;th&gt;触发时机&lt;/th&gt;&lt;th&gt;内容侧重&lt;/th&gt;&lt;th&gt;优先级&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
        &lt;tbody&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;动作级&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;E1·R1&lt;/td&gt;&lt;td&gt;单动作完成&lt;/td&gt;&lt;td&gt;动作质量：火柴人 + AI 点评 + PB（&lt;b&gt;竞品做不了&lt;/b&gt;）&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;P1&lt;/td&gt;&lt;/tr&gt;
          &lt;tr style=&quot;background:var(--acc-soft)&quot;&gt;&lt;td&gt;&lt;b&gt;课程级 ★&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;E2·R1&lt;/td&gt;&lt;td&gt;练完一节课&lt;/td&gt;&lt;td&gt;全局总结 + 肌群 + 动作列表 + 本次对比&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;&lt;b&gt;P0&lt;/b&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;计划级&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;E3·R2&lt;/td&gt;&lt;td&gt;完成 4/8 周计划&lt;/td&gt;&lt;td&gt;阶段成长：起点 vs 终点、能力变化（&lt;b&gt;成长叙事最强&lt;/b&gt;）&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;P1&lt;/td&gt;&lt;/tr&gt;
          &lt;tr&gt;&lt;td&gt;&lt;b&gt;周期级&lt;/b&gt;&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;E0·R2&lt;/td&gt;&lt;td&gt;周 / 月 / 年结束&lt;/td&gt;&lt;td&gt;累计趋势、streak、习惯（年度报告=传播峰值）&lt;/td&gt;&lt;td class=&quot;mono&quot;&gt;P1&lt;/td&gt;&lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;

    &lt;h3&gt;洞察引擎：六类可枚举的规则 &lt;span style=&quot;font-family:var(--mono);font-size:12px;color:var(--faint);font-weight:400&quot;&gt;点看例子&lt;/span&gt;&lt;/h3&gt;
    &lt;div class=&quot;tabs&quot; id=&quot;ovInsTabs&quot; style=&quot;margin-top:14px&quot;&gt;&lt;/div&gt;
    &lt;div class=&quot;card&quot; id=&quot;ovInsView&quot; style=&quot;margin-top:14px;border-left:3px solid var(--acc)&quot;&gt;&lt;/div&gt;

    &lt;div class=&quot;callout&quot; style=&quot;margin-top:18px&quot;&gt;&lt;b&gt;关键规则 · 双面报告&lt;/b&gt;：分享价值 = 意外性 × 正面性 × 可炫耀性。负面洞察（&quot;你三周没练背&quot;）对用户自己极有价值但绝不会被分享。所以同一份报告有两面——&lt;b&gt;App 内是&quot;教练&quot;&lt;/b&gt;（六类全说，含负面与建议），&lt;b&gt;分享出去是&quot;战报&quot;&lt;/b&gt;（只带正面，短图 1 条、长图最多 3 条，按分享价值分排序）。与&quot;一张图一个主角&quot;同源：洞察要被选出来，堆满 8 条 = 没有洞察。&lt;/div&gt;

    &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;冷启动的结构性优势&lt;/b&gt;：新用户没有历史，对比/归因/预测类洞察全部失效——但&lt;b&gt;火柴人 AI 点评和具象类比第一次训练就能给出 wow&lt;/b&gt;，不依赖任何历史。竞品的首份报告只能说&quot;你练了 30 分钟&quot;。首份报告的体验差距可能是新用户留存的分水岭。&lt;br&gt;&lt;span style=&quot;font-family:var(--mono);font-size:12px&quot;&gt;完整讨论见《04-设计-原子与报告 · 第 03 节》&lt;/span&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ==================== ③ ==================== --&gt;
  &lt;section id=&quot;s3&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;③ 具体的分享样式&lt;/div&gt;
    &lt;h2&gt;积木长什么样，拼起来长什么样&lt;/h2&gt;
    &lt;p class=&quot;lede&quot;&gt;样式分三层看：&lt;b&gt;原子&lt;/b&gt;（最小积木，22 个现役 + 7 个健康域预留）→ &lt;b&gt;模板&lt;/b&gt;（原子的预设组合，19+4）→ &lt;b&gt;成图&lt;/b&gt;（模板套上真实数据后的输出）。&lt;/p&gt;

    &lt;h3&gt;1 · 内容原子目录&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;每个原子只设计一次，通过&quot;数据绑定&quot;复用到不同场景——比如肌肉热力图，同一套版式可以表达&quot;这个动作练哪&quot;（解剖态）、&quot;我这次练了哪&quot;（强度态）、&quot;我这个月常练哪&quot;（覆盖态）。&lt;/p&gt;
    &lt;div id=&quot;atomGroups&quot;&gt;&lt;/div&gt;

    &lt;h3&gt;2 · 模板总目录&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;模板 = 预设的原子组合 + 版式 + 默认比例。这份目录同时是设计的工作清单和工程的注册表。&lt;/p&gt;
    &lt;div class=&quot;scroll&quot; style=&quot;margin-top:14px&quot;&gt;&lt;table id=&quot;tplTable&quot;&gt;&lt;/table&gt;&lt;/div&gt;

    &lt;h3&gt;3 · 成图样例（真实比例渲染 · 假数据）&lt;/h3&gt;
    &lt;p class=&quot;lede&quot;&gt;P0 课后报告的四个精选模板，按网格规范 1:1 渲染。宽度统一 360pt，比例差异只影响&quot;能装多少&quot;。&lt;/p&gt;
    &lt;div class=&quot;samples&quot; id=&quot;sampleRow&quot;&gt;&lt;/div&gt;

    &lt;h3&gt;4 · 网格标准（保证拼起来不散架）&lt;/h3&gt;
    &lt;div class=&quot;grid g2&quot; style=&quot;margin-top:14px&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h4 style=&quot;margin:0 0 8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--acc-ink)&quot;&gt;尺寸与预算&lt;/h4&gt;
        &lt;ul style=&quot;margin:0&quot;&gt;
          &lt;li&gt;&lt;b&gt;统一逻辑宽 360pt&lt;/b&gt;（@3x 导出 1080px），原子都是全宽横条&lt;/li&gt;
          &lt;li&gt;比例差异 = 高度预算：3:4 &lt;b&gt;432&lt;/b&gt; · 1:1 &lt;b&gt;312&lt;/b&gt; · 4:5 &lt;b&gt;402&lt;/b&gt; · 9:16 &lt;b&gt;440&lt;/b&gt;（含安全区）· 长图不限&lt;/li&gt;
          &lt;li&gt;范围锁定 1:1 ~ 9:16 + 长图，默认 3:4，&lt;b&gt;不做横图&lt;/b&gt;&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h4 style=&quot;margin:0 0 8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--acc-ink)&quot;&gt;节奏与规则&lt;/h4&gt;
        &lt;ul style=&quot;margin:0&quot;&gt;
          &lt;li&gt;边距 24 · 原子间缝 16 · 纵向 8pt 节奏；间距只有六个数（4/8/12/16/24/32）&lt;/li&gt;
          &lt;li&gt;原子高度三档 &lt;b&gt;S / M / L&lt;/b&gt;，&lt;b&gt;每张图最多一个 L&lt;/b&gt;——它就是主角&lt;/li&gt;
          &lt;li&gt;装箱：固定档先占位 → 弹性档吃剩余 → 不足则降档 → 再不足砍位重排（&lt;b&gt;绝不留空值&lt;/b&gt;）&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;出血权&lt;/b&gt;只给情绪类原子（氛围图/视频），数据类严格守边距&lt;/li&gt;
        &lt;/ul&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;!-- ==================== ④ ==================== --&gt;
  &lt;section id=&quot;s4&quot;&gt;
    &lt;div class=&quot;eyebrow&quot;&gt;④ 怎么落地&lt;/div&gt;
    &lt;h2&gt;一套管线，新场景只是配置&lt;/h2&gt;
    &lt;div class=&quot;grid g2&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h4 style=&quot;margin:0 0 10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--acc-ink)&quot;&gt;工程 · ShareKit 四层管线&lt;/h4&gt;
        &lt;ul style=&quot;margin:0&quot;&gt;
          &lt;li&gt;&lt;b&gt;DataProvider&lt;/b&gt; — 每实体一个，统一接口取数；隐私分级在此层强制&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Composition&lt;/b&gt; — 模板注册表（JSON，服务端可下发）；执行装箱与重排&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Render&lt;/b&gt; — 原子组件库；App 原生与公域 H5 共用同一份模板 DSL&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Carrier&lt;/b&gt; — 图像/H5/数据/PDF 四种输出 + 尺寸预设 + 水印 + 埋点&lt;/li&gt;
        &lt;/ul&gt;
        &lt;p style=&quot;color:var(--muted);font-size:13px;margin:12px 0 0&quot;&gt;接入新场景 = 写一个 Provider + 配一份模板 JSON，零 UI 开发、零分发开发。&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;card&quot;&gt;
        &lt;h4 style=&quot;margin:0 0 10px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--acc-ink)&quot;&gt;节奏 · 四阶段&lt;/h4&gt;
        &lt;ul style=&quot;margin:0&quot;&gt;
          &lt;li&gt;&lt;b&gt;Phase 1 框架输出&lt;/b&gt;（当前）— 原子清单、模板目录、网格标准 ✓&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Phase 2 核心上线&lt;/b&gt; — 课后报告 + T1~T4 + 图像载体，验证传播效果&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Phase 3 场景补全&lt;/b&gt; — 单动作、周期打卡、关系卡、排行榜&lt;/li&gt;
          &lt;li&gt;&lt;b&gt;Phase 4 配套完善&lt;/b&gt; — 公域 H5、数据导出（Pro）、PDF 报告、引流闭环&lt;/li&gt;
        &lt;/ul&gt;
        &lt;p style=&quot;color:var(--muted);font-size:13px;margin:12px 0 0&quot;&gt;优先级依据：R1 实例态分享动力最强，先做课后报告最快验证。&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;callout&quot;&gt;&lt;b&gt;北极星&lt;/b&gt;：流量 · 传播 · 留存。每张分享图底部的二维码、每个 H5 页面的下载入口，都是为了让分享出去的内容能把人带回来。&lt;/div&gt;
  &lt;/section&gt;

  &lt;footer style=&quot;margin-top:76px;padding-top:22px;border-top:1px solid var(--line);color:var(--faint);font-family:var(--mono);font-size:11.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px&quot;&gt;

  &lt;/footer&gt;
&lt;/div&gt;
